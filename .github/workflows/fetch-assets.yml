name: Fetch recipe data and photo candidates

on:
  push:
    branches: ['tools/**']
    paths: ['tools/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund sharp@0.34.3
      - name: Run stage
        run: |
          STAGE=$(cat tools/stage.txt)
          echo "stage: $STAGE"
          if [ "$STAGE" = "candidates" ]; then node tools/fetch-data.mjs || echo "data fetch failed"; node tools/fetch-photos.mjs; fi
          if [ "$STAGE" = "more" ]; then ONLY="$(cat tools/only.txt)" node tools/fetch-photos.mjs; fi
          if [ "$STAGE" = "final" ]; then node tools/fetch-final.mjs; fi
      - name: Commit results
        run: |
          git config user.name "SabiPlate asset fetcher"
          git config user.email "actions@users.noreply.github.com"
          for d in data candidates final; do if [ -e "$d" ]; then git add -A "$d"; fi; done
          git diff --cached --quiet || git commit -m "Fetched assets ($(cat tools/stage.txt))"
          git push
