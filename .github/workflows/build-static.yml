name: Build SabiPlate static site

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Verify static output
        run: |
          test -f dist/index.html
          test -f dist/assets/hero-wide.jpg
          test -f dist/assets/cookbook-cover.jpg
          test "$(ls dist/assets/recipes/*.webp | wc -l)" -eq 100
          ! grep -q "MutationObserver" dist/index.html
