"1/2 bell pepper","foodKey":"bell_pepper","grams":60,"unit":"g"},{"text":"1/2 carrot","foodKey":"carrot","grams":35,"unit":"g"},{"text":"1 tsp olive oil","foodKey":"olive_oil","grams":5,"unit":"g"},{"text":"lemon juice","foodKey":null,"grams":null,"unit":null},{"text":"paprika and black pepper","foodKey":null,"grams":null,"unit":null}],"nutritionStatus":"standardised-calculation","nutritionMappedIngredients":6}];</script>


<script>(() => {
  'use strict';
  const BRAND = {name:'SabiPlate', tagline:'Know your food. Own your goals.'};
  const DAYS=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  const SLOTS=['Breakfast','Lunch','Dinner','Snack'];
  const $=(s,r=document)=>r.querySelector(s);
  const $$=(s,r=document)=>[...r.querySelectorAll(s)];
  const memory=new Map();
  const store={
    get(k,f){try{const v=localStorage.getItem(k);return v===null?f:JSON.parse(v)}catch{return memory.has(k)?memory.get(k):f}},
    set(k,v){memory.set(k,v);try{localStorage.setItem(k,JSON.stringify(v))}catch{}},
    clear(){memory.clear();try{Object.keys(localStorage).filter(k=>k.startsWith('sabiplate-')).forEach(k=>localStorage.removeItem(k))}catch{}}
  };
  const recipes=Array.isArray(window.RECIPES)?window.RECIPES:[];
  const byId=id=>recipes.find(r=>r.id===id);
  const esc=s=>String(s??'').replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]));
  const titleCase=s=>String(s).replace(/\b\w/g,c=>c.toUpperCase());
  const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  const toast=msg=>{const el=$('#toast');if(!el)return;el.textContent=msg;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),2200)};
  const blankPlan=()=>Object.fromEntries(DAYS.map(d=>[d,Object.fromEntries(SLOTS.map(s=>[s,null]))]));
  const normalisePlan=p=>{const out=blankPlan();DAYS.forEach(d=>SLOTS.forEach(s=>{const id=p?.[d]?.[s];out[d][s]=byId(id)?id:null}));return out};
  const initialProfile={name:'Member',target:1750,goal:'Lose weight steadily',diet:'Everything',cuisines:['Nigerian','Global'],mealsPerDay:4};
  const state={
    profile:{...initialProfile,...store.get('sabiplate-profile-v9',{})},
    favourites:new Set(store.get('sabiplate-favourites-v9',[]).filter(byId)),
    plan:normalisePlan(store.get('sabiplate-plan-v9',{})),
    shopDone:new Set(store.get('sabiplate-shop-done-v9',[])),
    shopHave:new Set(store.get('sabiplate-shop-have-v9',[])),
    customShop:store.get('sabiplate-custom-shop-v9',[]),
    prepDone:new Set(store.get('sabiplate-prep-done-v9',[])),
    filter:{q:'',category:'All',cuisine:'All',maxCal:'All',minProtein:'All',favOnly:false},
    currentRecipe:null,servings:1,ingredientChecks:new Set(),
    picker:{recipeId:null,day:'Monday',slot:'Lunch'},
    chooser:{day:null,slot:null,q:''},
    generatedDay:null,builderLocks:new Set(),builderDay:'Monday',
    planMeta:store.get('sabiplate-plan-meta-v9',null),
    fridgeInput:store.get('sabiplate-fridge-v9','')
  };
  const save=()=>{
    store.set('sabiplate-profile-v9',state.profile);store.set('sabiplate-favourites-v9',[...state.favourites]);store.set('sabiplate-plan-v9',state.plan);
    store.set('sabiplate-shop-done-v9',[...state.shopDone]);store.set('sabiplate-shop-have-v9',[...state.shopHave]);store.set('sabiplate-custom-shop-v9',state.customShop);
    store.set('sabiplate-prep-done-v9',[...state.prepDone]);store.set('sabiplate-plan-meta-v9',state.planMeta);store.set('sabiplate-fridge-v9',state.fridgeInput);
    window.dispatchEvent(new CustomEvent('sabiplate:changed'));
  };

  function nav(name){
    closeMobileMore();
    $$('.view').forEach(v=>v.classList.toggle('active',v.id===`view-${name}`));
    $$('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===name));
    $$('.mobile-nav [data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===name));
    const more=$('#mobileMoreBtn'); if(more)more.classList.toggle('active',['prep','cookbook','profile'].includes(name));
    window.scrollTo({top:0,behavior:'auto'});
    if(name==='home')renderHome();if(name==='recipes')renderRecipes();if(name==='planner')renderPlanner();if(name==='shopping')renderShopping();if(name==='prep')renderPrep();if(name==='cookbook')renderCookbook();if(name==='profile')renderProfile();
    const main=$('#mainContent'); if(main)main.focus({preventScroll:true});
    window.dispatchEvent(new CustomEvent('sabiplate:view-rendered',{detail:{name}}));
  }
  $$('[data-nav]').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.nav)));

  function openMobileMore(){const s=$('#mobileMore');s?.classList.add('open');s?.setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}
  function closeMobileMore(){const s=$('#mobileMore');s?.classList.remove('open');s?.setAttribute('aria-hidden','true');if(!$('.modal.open'))document.body.style.overflow=''}
  $('#mobileMoreBtn')?.addEventListener('click',openMobileMore);$$('[data-close-sheet]').forEach(b=>b.addEventListener('click',closeMobileMore));$$('[data-sheet-nav]').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.sheetNav)));

  function recipeCard(r){
    return `<article class="recipe-card" data-id="${esc(r.id)}"><div class="recipe-img-wrap"><img src="${esc(r.image)}" data-fallback="${esc(r.imageFallback||'')}" onerror="this.onerror=null;if(this.dataset.fallback){this.src=this.dataset.fallback}" alt="${esc(r.title)}" loading="lazy"><button type="button" class="fav-btn ${state.favourites.has(r.id)?'on':''}" data-fav="${esc(r.id)}" aria-label="${state.favourites.has(r.id)?'Remove from':'Add to'} favourites">${state.favourites.has(r.id)?'♥':'♡'}</button></div><div class="recipe-card-body"><div class="tag-row"><span class="tag">${esc(r.category)}</span><span class="tag">${esc(r.cuisine)}</span></div><h3>${esc(r.title)}</h3><div class="macro-row"><span><b>${r.calories}</b> kcal</span><span><b>${r.protein}g</b> protein</span><span>${r.prep} min</span></div><div class="card-actions"><button type="button" class="open-recipe" data-open="${esc(r.id)}">View recipe</button><button type="button" class="add-plan" data-plan="${esc(r.id)}">+ Plan</button></div></div></article>`;
  }
  function bindRecipeActions(root=document){$$('[data-open]',root).forEach(b=>b.onclick=()=>openRecipe(b.dataset.open));$$('[data-plan]',root).forEach(b=>b.onclick=()=>openPlanPicker(b.dataset.plan));$$('[data-fav]',root).forEach(b=>b.onclick=e=>{e.stopPropagation();toggleFav(b.dataset.fav)})}
  function toggleFav(id){if(!byId(id))return;state.favourites.has(id)?state.favourites.delete(id):state.favourites.add(id);save();toast(state.favourites.has(id)?'Saved to favourites':'Removed from favourites');const a=$('.view.active');if(a)nav(a.id.replace('view-',''));if($('#recipeModal').classList.contains('open'))renderRecipeModal()}

  function homeCategory(category,label){const rs=recipes.filter(r=>r.category===category);const r=rs[Math.floor(rs.length/2)]||recipes[0];return `<button type="button" class="category-card" data-cat="${category}"><img src="${esc(r?.image||'')}" alt="${esc(label)}"><div><b>${esc(label)}</b><span>${rs.length} recipes</span></div></button>`}
  function preferencePenalty(r){let p=0;const d=state.profile.diet;if(d==='Nigerian-first'&&!/nigerian/i.test(r.cuisine+' '+r.tags.join(' ')))p+=45;if(d==='Higher protein')p-=r.protein*.8;if(d==='Plant-forward'&&!/(tofu|chickpea|lentil|bean|edamame|vegetarian)/i.test(r.title+' '+r.ingredients.join(' ')))p+=35;return p}
  function buildDay(target,{locked={},exclude={},randomise=true}={}){
    const groups=Object.fromEntries(SLOTS.map(s=>[s,recipes.filter(r=>r.category===s)]));
    if(SLOTS.some(s=>!groups[s].length))return null;
    const options=s=>locked[s]&&byId(locked[s])?[byId(locked[s])]:groups[s].filter(r=>r.id!==exclude[s]);
    const top=[];
    const push=c=>{top.push(c);top.sort((a,b)=>a.score-b.score);if(top.length>24)top.length=24};
    for(const b of options('Breakfast'))for(const l of options('Lunch'))for(const d of options('Dinner'))for(const sn of options('Snack')){
      const total=b.calories+l.calories+d.calories+sn.calories;const protein=b.protein+l.protein+d.protein+sn.protein;
      const pref=preferencePenalty(b)+preferencePenalty(l)+preferencePenalty(d)+preferencePenalty(sn);
      const score=Math.abs(total-target)+pref-Math.min(protein,150)*.12;
      push({Breakfast:b,Lunch:l,Dinner:d,Snack:sn,total,protein,score});
    }
    if(!top.length)return null;return randomise?top[Math.floor(Math.random()*Math.min(10,top.length))]:top[0];
  }
  function quickBreakfastPool(){
    const breakfastLike=/overnight oats|greek yogurt berry crunch|cottage cheese pineapple|pear ricotta|mango coconut chia|warm apple cinnamon yogurt|egg avocado tomato/i;
    return recipes.filter(r=>(r.category==='Breakfast'&&r.prep<=10)||(r.category==='Snack'&&r.prep<=10&&breakfastLike.test(r.title)));
  }
  function batchPenalty(r,quick=false){
    const t=(r.title+' '+r.ingredients.join(' ')).toLowerCase();let p=preferencePenalty(r);
    if(/stew|pottage|porridge|jollof|rice|pasta|curry|chili|chilli|bolognese|beans|couscous|quinoa|bulgur|sweet potato|yam/.test(t))p-=35;
    if(/wrap|lettuce|salad|avocado|cucumber|skewer|toast/.test(t))p+=55;
    if(/salmon|tilapia|mackerel|tuna|prawn|shrimp|cod|fish/.test(t))p+=20;
    if(r.protein>=35)p-=12;if(r.prep<=30)p-=12;if(quick&&r.prep>30)p+=1000;
    return p;
  }
  function pickDistinct(pool,count,scoreFn){
    const chosen=[];let candidates=[...pool];
    for(let i=0;i<count&&candidates.length;i++){
      const ranked=candidates.map(r=>({r,score:scoreFn(r)})).sort((a,b)=>a.score-b.score);
      const window=ranked.slice(0,Math.min(6,ranked.length));const pick=window[Math.floor(Math.random()*Math.min(3,window.length))]?.r||ranked[0].r;
      chosen.push(pick);candidates=candidates.filter(r=>r.id!==pick.id);
    }
    return chosen;
  }
  function usageCounts(){const m=new Map();DAYS.forEach(d=>SLOTS.forEach(s=>{const id=state.plan[d][s];if(id)m.set(id,(m.get(id)||0)+1)}));return m}
  function uniquePlanRecipes(slots=SLOTS){const set=new Set();DAYS.forEach(d=>slots.forEach(s=>{const id=state.plan[d][s];if(id)set.add(id)}));return set}
  function busySlotNote(day,slot){
    if(slot==='Breakfast')return '5–10 min breakfast';
    if(slot==='Snack')return 'Grab & go / prep ahead';
    const notes={
      Monday:{Lunch:'Sunday batch • reheat',Dinner:'Sunday batch • reheat'},
      Tuesday:{Lunch:'Sunday batch • reheat',Dinner:'Sunday batch • reheat'},
      Wednesday:{Lunch:'Sunday batch • reheat',Dinner:'Sunday batch • reheat'},
      Thursday:{Lunch:'Wednesday 30-min cook • portion 1',Dinner:'Sunday batch • freezer portion'},
      Friday:{Lunch:'Wednesday batch • reheat',Dinner:'Friday 30-min cook • portion 1'},
      Saturday:{Lunch:'Friday batch • reheat',Dinner:'Wednesday batch • reheat'},
      Sunday:{Lunch:'Sunday batch • freezer portion',Dinner:'Friday batch • reheat'}
    };
    return notes[day]?.[slot]||'Planned portion';
  }
  function generateBusyWeek(){
    const target=+state.profile.target||1750;
    const breakfasts=pickDistinct(quickBreakfastPool(),3,r=>Math.abs(r.calories-target*.20)+preferencePenalty(r));
    const snacks=pickDistinct(recipes.filter(r=>r.category==='Snack'&&r.prep<=10&&!breakfasts.some(b=>b.id===r.id)),2,r=>Math.abs(r.calories-target*.16)+preferencePenalty(r));
    const avgB=(breakfasts.reduce((a,r)=>a+r.calories,0)/(breakfasts.length||1))||300;
    const avgS=(snacks.reduce((a,r)=>a+r.calories,0)/(snacks.length||1))||220;
    const mainTarget=Math.max(380,(target-avgB-avgS)/2);
    const mains=recipes.filter(r=>r.category==='Lunch'||r.category==='Dinner');
    const weekend=pickDistinct(mains,2,r=>Math.abs(r.calories-mainTarget)+batchPenalty(r,false));
    const remaining=mains.filter(r=>!weekend.some(x=>x.id===r.id));
    const midweek=pickDistinct(remaining.filter(r=>r.prep<=30),2,r=>Math.abs(r.calories-mainTarget)+batchPenalty(r,true));
    if(breakfasts.length<3||snacks.length<2||weekend.length<2||midweek.length<2){toast('Not enough suitable recipes to build the busy-week plan');return}
    const [A,B]=weekend,[C,D]=midweek;
    const mainMap={
      Monday:{Lunch:A,Dinner:B},Tuesday:{Lunch:B,Dinner:A},Wednesday:{Lunch:A,Dinner:B},
      Thursday:{Lunch:C,Dinner:B},Friday:{Lunch:C,Dinner:D},Saturday:{Lunch:D,Dinner:C},Sunday:{Lunch:A,Dinner:D}
    };
    const bPattern=[0,1,0,2,1,2,0],sPattern=[0,1,0,1,0,1,0];
    state.plan=blankPlan();
    DAYS.forEach((day,i)=>{state.plan[day].Breakfast=breakfasts[bPattern[i]].id;state.plan[day].Snack=snacks[sPattern[i]].id;state.plan[day].Lunch=mainMap[day].Lunch.id;state.plan[day].Dinner=mainMap[day].Dinner.id});
    state.planMeta={mode:'busy',weekend:[A.id,B.id],wednesday:C.id,friday:D.id,breakfasts:breakfasts.map(r=>r.id),snacks:snacks.map(r=>r.id)};
    state.prepDone.clear();save();toast('Busy-week plan created: 4 mains, 3 quick breakfasts, 3 cook sessions');
  }

  function ensureGenerated(){if(!state.generatedDay)state.generatedDay=buildDay(+state.profile.target||1750)}
  function generatedDelta(g,target){const d=g.total-target;const cls=Math.abs(d)<=80?'delta-good':'delta-warn';return `<span class="${cls}">${d===0?'on target':`${Math.abs(d)} kcal ${d>0?'over':'under'}`}</span>`}
  function regenerateBuilder(){const locked={};state.builderLocks.forEach(s=>{if(state.generatedDay?.[s])locked[s]=state.generatedDay[s].id});state.generatedDay=buildDay(+state.profile.target||1750,{locked,randomise:true});renderHome();toast('New combination generated')}
  function swapGenerated(slot){ensureGenerated();const locked={};SLOTS.filter(s=>s!==slot).forEach(s=>locked[s]=state.generatedDay[s].id);state.generatedDay=buildDay(+state.profile.target||1750,{locked,exclude:{[slot]:state.generatedDay[slot].id},randomise:true});renderHome();toast(`${slot} swapped`)}

  function renderHome(){
    const el=$('#view-home');const fav=recipes.filter(r=>state.favourites.has(r.id)).slice(0,4);
    el.innerHTML=`<section class="hero hero-simple"><div class="hero-copy"><h1 id="homeHeading">Know your food.<em>Own your goals.</em></h1><p>Nigerian and global meals, portioned for everyone at your table.</p><div class="hero-actions"><button type="button" class="primary-btn" data-nav-local="planner">Open my plan</button><button type="button" class="secondary-btn" data-nav-local="recipes">Browse recipes</button></div></div><div class="hero-visual" style="background-image:url('${esc('./assets/hero-wide.jpg?v=r7')}')"></div></section>
      <div id="homeToday"></div>
      <section class="section home-browse"><div class="section-head"><h2>Browse by meal</h2><button type="button" class="ghost-btn" data-nav-local="recipes">All ${recipes.length} recipes</button></div><div class="category-grid">${homeCategory('Breakfast','Breakfast')}${homeCategory('Lunch','Lunch')}${homeCategory('Dinner','Dinner')}${homeCategory('Snack','Snacks')}</div></section>
      ${fav.length?`<section class="section"><div class="section-head"><h2>Your favourites</h2></div><div class="recipe-grid">${fav.map(recipeCard).join('')}</div></section>`:''}`;
    bindRecipeActions(el);$$('[data-cat]',el).forEach(b=>b.onclick=()=>{state.filter.category=b.dataset.cat;nav('recipes')});$$('[data-nav-local]',el).forEach(b=>b.onclick=()=>nav(b.dataset.navLocal));
  }
  function discoveryCard(title,list){return `<div class="discovery-card"><h3>${esc(title)}</h3><div class="mini-list">${list.map(r=>`<button type="button" class="mini-recipe" data-open="${r.id}"><img src="${esc(r.image)}" data-fallback="${esc(r.imageFallback||'')}" onerror="this.onerror=null;if(this.dataset.fallback){this.src=this.dataset.fallback}" alt=""><span><b>${esc(r.title)}</b><small>${r.calories} kcal • ${r.protein}g</small></span></button>`).join('')}</div></div>`}
  function setTarget(n){n=Math.max(1000,Math.min(4000,Math.round(n/10)*10));state.profile.target=n;state.builderLocks.clear();state.generatedDay=buildDay(n,{randomise:true});save();renderHome()}

  function filteredRecipes(){const f=state.filter;return recipes.filter(r=>{const text=(r.title+' '+r.cuisine+' '+r.tags.join(' ')+' '+r.ingredients.join(' ')).toLowerCase();return (!f.q||text.includes(f.q.toLowerCase()))&&(f.category==='All'||r.category===f.category)&&(f.cuisine==='All'||r.cuisine===f.cuisine)&&(f.maxCal==='All'||r.calories<=+f.maxCal)&&(f.minProtein==='All'||r.protein>=+f.minProtein)&&(!f.favOnly||state.favourites.has(r.id))})}
  function renderRecipeResults(){const list=filteredRecipes();const meta=$('#recipeResultCount');const grid=$('#recipeResults');if(meta)meta.textContent=`${list.length} recipe${list.length===1?'':'s'}`;if(grid){grid.innerHTML=list.length?list.map(recipeCard).join(''):'<div class="empty" style="grid-column:1/-1">No recipes match those filters. Try clearing one or two filters.</div>';bindRecipeActions(grid)}const f=$('#favOnlyBtn');if(f)f.textContent=state.filter.favOnly?'Show all recipes':'Favourites only'}

  function swapPlanMeal(day,slot){
    const current=byId(state.plan[day][slot]);if(!current)return;
    const used=uniquePlanRecipes();
    if(state.planMeta?.mode==='busy'){
      let pool;
      if(slot==='Breakfast')pool=quickBreakfastPool();
      else if(slot==='Snack')pool=recipes.filter(r=>r.category==='Snack'&&r.prep<=10);
      else pool=recipes.filter(r=>(r.category==='Lunch'||r.category==='Dinner')&&(state.planMeta.wednesday===current.id||state.planMeta.friday===current.id?r.prep<=30:true));
      const candidates=pool.filter(r=>r.id!==current.id&&!used.has(r.id)).map(r=>({r,score:Math.abs(r.calories-current.calories)+preferencePenalty(r)+(slot==='Lunch'||slot==='Dinner'?batchPenalty(r,r.prep<=30):0)})).sort((a,b)=>a.score-b.score);
      if(!candidates.length)return;
      const pick=candidates[Math.floor(Math.random()*Math.min(4,candidates.length))].r;let replaced=0;
      DAYS.forEach(d=>SLOTS.forEach(s=>{if(state.plan[d][s]===current.id){state.plan[d][s]=pick.id;replaced++}}));
      const m=state.planMeta;if(Array.isArray(m.weekend))m.weekend=m.weekend.map(id=>id===current.id?pick.id:id);if(m.wednesday===current.id)m.wednesday=pick.id;if(m.friday===current.id)m.friday=pick.id;if(Array.isArray(m.breakfasts))m.breakfasts=m.breakfasts.map(id=>id===current.id?pick.id:id);if(Array.isArray(m.snacks))m.snacks=m.snacks.map(id=>id===current.id?pick.id:id);
      save();renderPlanner();toast(`Swapped ${replaced} planned portion${replaced===1?'':'s'} together`);return;
    }
    const currentTotals=dayTotals(day),goal=+state.profile.target||1750;const occupied=new Set(SLOTS.map(s=>state.plan[day][s]).filter(Boolean));const candidates=recipes.filter(r=>r.category===slot&&r.id!==current.id&&!occupied.has(r.id)).map(r=>({r,score:Math.abs((currentTotals.cal-current.calories+r.calories)-goal)-r.protein*.08})).sort((a,b)=>a.score-b.score);if(!candidates.length)return;const pick=candidates[Math.floor(Math.random()*Math.min(5,candidates.length))].r;state.plan[day][slot]=pick.id;save();renderPlanner();toast(`${slot} swapped on ${day}`)
  }

    const meta=state.planMeta;
    if(meta?.mode==='busy'){
      const A=byId(meta.weekend?.[0]),B=byId(meta.weekend?.[1]),C=byId(meta.wednesday),D=byId(meta.friday);
      if(A)sunday.push(`Batch-cook ${A.title}: ${counts.get(A.id)||0} portions for this week. Cool promptly and freeze the later portion.`);
      if(B)sunday.push(`Batch-cook ${B.title}: ${counts.get(B.id)||0} portions. Keep early-week portions chilled and freeze the later one.`);
      sunday.push('Wash and chop sturdy vegetables, portion two grab-and-go snacks, and set up any overnight breakfast components.');
      if(C)wed.push(`Cook ${C.title}: ${counts.get(C.id)||0} portions. This recipe is designed to fit a roughly 30-minute midweek top-up.`);
      wed.push('Refresh salad vegetables, fruit and herbs for the next few days.');
      if(D)fri.push(`Cook ${D.title}: ${counts.get(D.id)||0} portions for the weekend. This is your second short top-up cook.`);
      fri.push('Move any frozen weekend portions into the fridge in time to thaw safely and finish portioning snacks.');
      return{sunday,wed,fri};
    }
    const selected=DAYS.flatMap(d=>SLOTS.map(s=>byId(state.plan[d][s]))).filter(Boolean);const text=selected.flatMap(r=>r.ingredients).join(' ').toLowerCase();
    if(/rice|quinoa|couscous|bulgur|pasta|oats/.test(text))sunday.push('Batch-cook the grains needed for Monday to Wednesday and cool them promptly.');
    if(/chicken|turkey|beef/.test(text))sunday.push('Season and cook the poultry or lean meat needed for the first half of the week.');
    sunday.push('Wash and chop sturdy vegetables and portion two days of snacks.');wed.push('Refresh vegetables and cook one short midweek meal.');fri.push('Do one short weekend top-up cook and move frozen portions to the fridge as needed.');return{sunday,wed,fri};
  }
  function prepTaskHtml(group,text){const id=`${group}:${slug(text)}`;return `<label class="prep-task ${state.prepDone.has(id)?'done':''}"><input type="checkbox" data-prep="${esc(id)}" ${state.prepDone.has(id)?'checked':''}><span>${esc(text)}</span></label>`}
  function fridgeMatches(input){const terms=input.toLowerCase().split(/[\n,]/).map(x=>ingredientBase(x)).filter(Boolean);if(!terms.length)return[];const staple=/salt|pepper|oil|water|season|spice|herb|paprika|garlic|lemon|lime/;return recipes.map(r=>{const bases=r.ingredients.map(ingredientBase);const matched=bases.filter(base=>terms.some(t=>base.includes(t)||t.includes(base)));const missing=[...new Set(bases.filter(base=>!matched.includes(base)&&!staple.test(base)))];const score=matched.length/(bases.length||1)*100+matched.length*4;return{r,matched:[...new Set(matched)],missing,score}}).filter(x=>x.matched.length).sort((a,b)=>b.score-a.score||a.missing.length-b.missing.length).slice(0,10)}
  function renderPrep(){const el=$('#view-prep');const ideas=prepIdeas();el.innerHTML=`<div class="page-head"><div><span class="eyebrow">Prep my fortnight</span><h1>Your realistic cook schedule</h1><p>Sunday does the heavy lifting and a short Wednesday top-up covers the rest, so most meals are simply reheat-and-eat.</p></div><button type="button" class="ghost-btn" id="resetPrep">Reset prep ticks</button></div><div class="prep-layout"><div><div class="prep-columns"><div class="prep-day"><h3>Sunday • aim 1–2 hours</h3>${ideas.sunday.map(x=>prepTaskHtml('sun',x)).join('')}</div><div class="prep-day"><h3>Wednesday • ≤30 min</h3>${ideas.wed.map(x=>prepTaskHtml('wed',x)).join('')}</div><div class="prep-day"><h3>Friday • ≤30 min</h3>${ideas.fri.map(x=>prepTaskHtml('fri',x)).join('')}</div></div><div class="fridge-box"><h3 class="sidebar-title">What can I make with what’s in my fridge?</h3><p class="muted">Type ingredients separated by commas. We’ll rank recipes by match and show how many meaningful ingredients are missing.</p><textarea id="fridgeInput" placeholder="chicken, spinach, tomato, Greek yogurt">${esc(state.fridgeInput)}</textarea><button type="button" class="primary-btn" id="fridgeSearch" style="margin-top:8px">Find recipes</button><div id="fridgeResults" class="match-list"></div></div></div><aside class="panel"><h3 class="sidebar-title">Safe storage basics</h3><ul><li>Cool cooked food promptly before refrigerating.</li><li>Keep cooked meals chilled and reheat thoroughly.</li><li>Freeze extra soups, stews and cooked grains in labelled portions.</li><li>Follow local food-safety guidance for exact storage times.</li></ul><h3 class="sidebar-title">Your week</h3><p class="muted">${planCount()} meals are currently planned.</p></aside></div>`;
    $$('[data-prep]',el).forEach(c=>c.onchange=()=>{c.checked?state.prepDone.add(c.dataset.prep):state.prepDone.delete(c.dataset.prep);save();renderPrep()});$('#resetPrep').onclick=()=>{state.prepDone.clear();save();renderPrep()};$('#fridgeSearch').onclick=()=>renderFridgeResults();$('#fridgeInput').oninput=e=>{state.fridgeInput=e.target.value;save()};if(state.fridgeInput.trim())renderFridgeResults()
  }
  function renderFridgeResults(){const input=$('#fridgeInput')?.value||state.fridgeInput;state.fridgeInput=input;save();const m=fridgeMatches(input);const out=$('#fridgeResults');if(!out)return;out.innerHTML=m.length?m.map(x=>`<div class="match"><span><b>${esc(x.r.title)}</b><small class="muted">Matches ${x.matched.length} • ${x.missing.length} meaningful ingredient${x.missing.length===1?'':'s'} missing</small><small>${x.matched.length?'Have: '+esc(x.matched.slice(0,4).join(', ')):''}</small></span><div class="match-actions"><button type="button" class="ghost-btn" data-fridge-open="${x.r.id}">View</button>${x.missing.length?`<button type="button" class="ghost-btn" data-add-missing="${x.r.id}">Add missing</button>`:''}</div></div>`).join(''):'<p class="muted">No close matches yet. Try broader ingredient names such as chicken, rice, spinach or beans.</p>';$$('[data-fridge-open]',out).forEach(b=>b.onclick=()=>openRecipe(b.dataset.fridgeOpen));$$('[data-add-missing]',out).forEach(b=>b.onclick=()=>{const match=m.find(x=>x.r.id===b.dataset.addMissing);match?.missing.forEach(t=>{if(!state.customShop.some(x=>x.text.toLowerCase()===t.toLowerCase()))addCustomShop(titleCase(t))});save();toast('Missing ingredients added to shopping list')})}

  function renderCookbook(){const el=$('#view-cookbook');const cols=[['Power Breakfasts',r=>r.category==='Breakfast'],['Power Lunches',r=>r.category==='Lunch'],['Power Dinners',r=>r.category==='Dinner'],['Power Snacks',r=>r.category==='Snack'],['Nigerian favourites',r=>/Nigerian/.test(r.cuisine)]];el.innerHTML=`<div class="page-head"><div><span class="eyebrow">Cookbook</span><h1>The SabiPlate cookbook</h1><p>${recipes.length} recipes with gram weights, method and nutrition. Open any recipe to print it or save it as a PDF.</p></div></div><div class="cookbook-layout"><div><img class="book-cover" src="./assets/cookbook-cover.jpg?v=r7" alt="SabiPlate cookbook cover"></div><div>${cols.map(([name,test])=>{const list=recipes.filter(test);return `<h2 style="font-family:Georgia,serif;color:var(--green);margin:18px 0 8px">${name} <small class="muted" style="font-size:13px;font-family:inherit">${list.length} recipes</small></h2><div class="feature-list">${list.map(r=>`<button type="button" class="feature" data-open="${esc(r.id)}" style="text-align:left;cursor:pointer;font:inherit;width:100%"><b>${esc(r.title)}</b><span>${r.calories} kcal · ${r.protein}g protein · ${r.prep} min</span></button>`).join('')}</div>`}).join('')}<div class="nutrition-note">Calories and macros are estimates worked out from standard ingredient weights. <a href=\"./credits.html\">Photo credits</a></div></div></div>`;el.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openRecipe(b.dataset.open))}

  function renderProfile(){const el=$('#view-profile');const favs=recipes.filter(r=>state.favourites.has(r.id));const cloudUser=window.SABI_CLOUD?.user;el.innerHTML=`<div class="page-head"><div><span class="eyebrow">Your profile</span><h1>Goals and preferences</h1><p>Keep onboarding short now. More detailed profile information can stay optional later.</p></div></div><div class="profile-grid"><div class="panel"><div class="profile-card"><div class="big-avatar">${esc((state.profile.name||'M')[0].toUpperCase())}</div><div><h2 style="margin:0;font-family:Georgia,serif;color:var(--green)">${esc(state.profile.name||'Member')}</h2><p class="muted" style="margin:5px 0">${esc(state.profile.goal)}</p></div></div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><div class="form-grid"><div class="form-field"><label for="profileName">First name / display name</label><input id="profileName" value="${esc(state.profile.name)}"></div><div class="form-field"><label for="profileTarget">Daily calorie target</label><input id="profileTarget" type="number" min="1000" max="4000" step="50" value="${+state.profile.target||1750}"></div><div class="form-field"><label for="profileGoal">Main goal</label><select id="profileGoal">${['Lose weight steadily','Maintain weight','Build muscle','Eat better'].map(x=>`<option ${state.profile.goal===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-field"><label for="profileDiet">Food preference</label><select id="profileDiet">${['Everything','Nigerian-first','Higher protein','Plant-forward'].map(x=>`<option ${state.profile.diet===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-field"><label for="profileMeals">Meals per day</label><select id="profileMeals">${[3,4,5].map(x=>`<option value="${x}" ${+state.profile.mealsPerDay===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="form-field"><label>Preferred cuisines</label><div class="choice-row">${['Nigerian','Global'].map(x=>`<label class="choice-chip"><input type="checkbox" data-cuisine-pref="${x}" ${(state.profile.cuisines||[]).includes(x)?'checked':''}> ${x}</label>`).join('')}</div></div><button type="button" class="primary-btn" id="saveProfile">Save preferences</button><div class="account-note">${cloudUser?'<b>Cloud sync active:</b> your preferences, favourites, plans and shopping progress save automatically.':'<b>Guest mode:</b> this device is saving your progress locally. Create a free account to sync it securely across devices.'}</div></div><aside class="panel"><h3 class="sidebar-title">Your activity</h3><p><b>${state.favourites.size}</b> favourites</p><p><b>${planCount()}</b> planned meals</p><p><b>${state.profile.target}</b> kcal target</p><button type="button" class="auth-primary" data-auth-profile-action style="margin:2px 0 12px">${cloudUser?'Manage account & sync':'Create free account'}</button><button type="button" class="danger-btn" id="resetApp">Reset SabiPlate data</button></aside></div>${favs.length?`<section class="section"><div class="section-head"><h2>Favourite recipes</h2></div><div class="recipe-grid">${favs.slice(0,8).map(recipeCard).join('')}</div></section>`:''}`;
    bindRecipeActions(el);$('#saveProfile').onclick=()=>{state.profile.name=$('#profileName').value.trim()||'Member';state.profile.target=Math.max(1000,Math.min(4000,+$('#profileTarget').value||1750));state.profile.goal=$('#profileGoal').value;state.profile.diet=$('#profileDiet').value;state.profile.mealsPerDay=+$('#profileMeals').value;state.profile.cuisines=$$('[data-cuisine-pref]:checked',el).map(x=>x.dataset.cuisinePref);state.generatedDay=null;state.builderLocks.clear();save();$('#avatarBtn').textContent=state.profile.name[0].toUpperCase();toast('Preferences saved');renderProfile()};$('#resetApp').onclick=()=>{if(confirm('Reset your SabiPlate data on this device?')){store.clear();location.reload()}}
  }

  document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#mealChooser').classList.contains('open'))closeMealChooser();else if($('#planPicker').classList.contains('open'))closePlanPicker();else if($('#recipeModal').classList.contains('open'))closeRecipe();else closeMobileMore()}});
  $('#avatarBtn').textContent=(state.profile.name||'M')[0].toUpperCase();
  let installPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('#installBtn')?.classList.remove('hidden')});$('#installBtn')?.addEventListener('click',async()=>{if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;$('#installBtn').classList.add('hidden')});
  window.SABI_DEBUG={toast,state,recipes,nav,openRecipe,buildDay,generateBusyWeek,swapPlanMeal,prepIdeas,uniquePlanRecipes,quickBreakfastPool,filteredRecipes,ingredientBase,shoppingItems,fridgeMatches,save,renderProfile,renderHome,renderPlanner};
  renderHome();
})();
</script>
